name: Launcher configuration checks
on:
  push:
    paths:
      - 'tools/universal/**'
      - 'install/**'
      - 'tools/release-correctness.py'
      - 'tools/test-release-correctness.py'
      - 'doctor.py'
      - 'profiles/**'
      - 'examples/vision/**'
      - '.github/workflows/launcher-configs.yml'
  pull_request:
    paths:
      - 'tools/universal/**'
      - 'install/**'
      - 'tools/release-correctness.py'
      - 'tools/test-release-correctness.py'
      - 'doctor.py'
      - 'profiles/**'
      - 'examples/vision/**'
      - '.github/workflows/launcher-configs.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check shell syntax and launcher arguments
        run: |
          bash -n tools/universal/l0xre tools/universal/l0xre-sm86 tools/universal/l0xre-sm89 tools/universal/l0xre-sm120 examples/vision/serve-cpu-sm86.sh
          python3 tools/universal/test-linux-launchers.py
          python3 tools/universal/test-fast-launcher.py
          python3 tools/test-release-correctness.py
      - name: Check guided Linux installer with offline archives
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          bash -n install/install.sh
          python3 -m unittest discover -s install -p 'test_install.py'
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Windows launcher arguments with a stub executable
        shell: powershell
        run: .\tools\universal\test-windows-launcher.ps1
      - name: Check guided Windows installer with offline archives
        shell: powershell
        run: .\install\test-windows.ps1
